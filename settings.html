<div class="st-char-translator-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b><i class="fa-solid fa-language"></i> Character Translator</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <p class="notes">Clone any character card and translate its attributes, dialogue examples, and lore into a target language using your connected LLM.</p>
            
            <div class="st-char-trans-action-row" style="margin: 10px 0;">
                <button id="st_char_trans_open_btn" class="menu_button">
                    <i class="fa-solid fa-clone"></i> Open Character Translator
                </button>
            </div>

            <div class="st-char-trans-config-row">
                <label for="st_char_trans_default_lang">Default Target Language:</label>
                <div style="display: flex; gap: 6px; margin-top: 2px;">
                    <select id="st_char_trans_default_lang" class="text_pole" style="flex: 1;">
                        <option value="Japanese">Japanese (日本語)</option>
                        <option value="Spanish">Spanish (Español)</option>
                        <option value="French">French (Français)</option>
                        <option value="German">German (Deutsch)</option>
                        <option value="Chinese (Simplified)">Chinese Simplified (简体中文)</option>
                        <option value="Chinese (Traditional)">Chinese Traditional (繁體中文)</option>
                        <option value="Korean">Korean (한국어)</option>
                        <option value="Russian">Russian (Русский)</option>
                        <option value="Italian">Italian (Italiano)</option>
                        <option value="Portuguese">Portuguese (Português)</option>
                        <option value="Vietnamese">Vietnamese (Tiếng Việt)</option>
                        <option value="Arabic">Arabic (العربية)</option>
                        <option value="Indonesian">Indonesian (Bahasa Indonesia)</option>
                        <option value="Thai">Thai (ไทย)</option>
                        <option value="English">English</option>
                        <option value="custom">-- Custom Language --</option>
                    </select>
                    <input id="st_char_trans_custom_lang" type="text" class="text_pole" placeholder="Custom language..." style="flex: 1; display: none;" />
                </div>
            </div>

            <div class="st-char-trans-config-row" style="margin-top: 8px;">
                <label for="st_char_trans_custom_prompt">Custom Translation Prompt / Glossary Instructions:</label>
                <textarea id="st_char_trans_custom_prompt" class="text_pole" rows="3" placeholder="e.g. Use formal Japanese keigo for this character; keep fantasy terms; translate specific names as..."></textarea>
                <small class="notes">Additional prompt rules injected into the translation model.</small>
            </div>

            <div class="st-char-trans-config-row" style="margin-top: 8px;">
                <label for="st_char_trans_name_suffix">Name Suffix:</label>
                <input id="st_char_trans_name_suffix" type="text" class="text_pole" value=" [{lang}]" placeholder="e.g. [{lang}] or (Translated)" />
                <small class="notes">Use <code>{lang}</code> to automatically insert the target language code or name.</small>
            </div>

            <div class="st-char-trans-config-row" style="margin-top: 8px;">
                <label class="checkbox_label">
                    <input id="st_char_trans_auto_switch" type="checkbox" checked />
                    <span>Automatically switch to translated character upon completion</span>
                </label>
            </div>
        </div>
    </div>
</div>
